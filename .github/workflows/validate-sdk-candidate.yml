name: Validate SDK Candidate

# Verified candidate runtime matrix: Python 3.10, Python 3.11, Python 3.12, Python 3.13
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/QUICKSTART.md'
      - 'docs/AX-PUB-DEV-001_DEVELOPER_ADOPTION_SDK_READINESS_PROGRAM.md'
      - 'docs/AX-PUB-DEV-004_SDK_CANDIDATE_ENGINEERING_BASELINE.md'
      - 'artifacts/AX-PUB-DEV-004.json'
      - 'artifacts/AX-PUB-MANIFEST-001.json'
      - 'evidence/AX-PUB-CI-005_SDK_CANDIDATE_VALIDATION.md'
      - 'sdk-candidate/**'
      - 'tools/check_sdk_candidate_boundary.py'
      - 'tools/check_sdk_candidate_state.py'
      - 'tools/check_developer_experience_state.py'
      - 'tools/check_artifact_manifest.py'
      - '.github/workflows/validate-sdk-candidate.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/QUICKSTART.md'
      - 'docs/AX-PUB-DEV-001_DEVELOPER_ADOPTION_SDK_READINESS_PROGRAM.md'
      - 'docs/AX-PUB-DEV-004_SDK_CANDIDATE_ENGINEERING_BASELINE.md'
      - 'artifacts/AX-PUB-DEV-004.json'
      - 'artifacts/AX-PUB-MANIFEST-001.json'
      - 'evidence/AX-PUB-CI-005_SDK_CANDIDATE_VALIDATION.md'
      - 'sdk-candidate/**'
      - 'tools/check_sdk_candidate_boundary.py'
      - 'tools/check_sdk_candidate_state.py'
      - 'tools/check_developer_experience_state.py'
      - 'tools/check_artifact_manifest.py'
      - '.github/workflows/validate-sdk-candidate.yml'

permissions:
  contents: read

jobs:
  sdk-candidate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Confirm runtime
        run: python --version

      - name: Parse SDK candidate machine-readable state
        run: python -m json.tool artifacts/AX-PUB-DEV-004.json > /dev/null

      - name: Compile SDK candidate surfaces
        run: |
          python -m py_compile sdk-candidate/python/aetherx_sdk_candidate.py
          python -m py_compile sdk-candidate/python/example.py
          python -m py_compile sdk-candidate/python/run_candidate_conformance.py
          python -m py_compile sdk-candidate/python/tests/test_sdk_candidate.py
          python -m py_compile tools/check_sdk_candidate_boundary.py
          python -m py_compile tools/check_sdk_candidate_state.py
          python -m py_compile tools/check_developer_experience_state.py
          python -m py_compile tools/check_artifact_manifest.py

      - name: Run SDK candidate unit tests
        run: python -m unittest discover -s sdk-candidate/python/tests -v

      - name: Run SDK candidate example
        run: python sdk-candidate/python/example.py

      - name: Run SDK candidate conformance
        run: python sdk-candidate/python/run_candidate_conformance.py

      - name: Validate SDK candidate public boundary
        run: python tools/check_sdk_candidate_boundary.py

      - name: Validate closed DEV-GATE-02 governance state
        run: python tools/check_sdk_candidate_state.py

      - name: Re-validate closed DEV-GATE-01 state
        run: python tools/check_developer_experience_state.py

      - name: Re-validate public artifact governance
        run: python tools/check_artifact_manifest.py
