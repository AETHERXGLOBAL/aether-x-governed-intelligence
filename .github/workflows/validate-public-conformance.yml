name: Validate Public Conformance Kit

on:
  push:
    branches: [main]
    paths:
      - 'conformance/**'
      - 'reference-implementations/eav-contract-validator/**'
      - 'reference-implementations/point-in-time-knowledge-validator/**'
      - 'tools/check_public_conformance_boundary.py'
      - '.github/workflows/validate-public-conformance.yml'
  pull_request:
    paths:
      - 'conformance/**'
      - 'reference-implementations/eav-contract-validator/**'
      - 'reference-implementations/point-in-time-knowledge-validator/**'
      - 'tools/check_public_conformance_boundary.py'
      - '.github/workflows/validate-public-conformance.yml'

permissions:
  contents: read

jobs:
  validate-public-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public repository only
        uses: actions/checkout@v4

      - name: Enforce private-project boundary
        run: python3 tools/check_public_conformance_boundary.py

      - name: Parse conformance vectors
        run: python3 -m json.tool conformance/AX-PUB-TEST-001/vectors.json > /dev/null

      - name: Compile public conformance runner
        run: python3 -m py_compile conformance/AX-PUB-TEST-001/run_conformance.py

      - name: Run public conformance suite
        run: python3 conformance/AX-PUB-TEST-001/run_conformance.py

      - name: Emit machine-readable conformance report
        run: python3 conformance/AX-PUB-TEST-001/run_conformance.py --json > /tmp/ax-public-conformance-report.json
