name: Validate Public Artifact Manifest

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'artifacts/**'
      - 'conformance/**'
      - 'docs/**'
      - 'evidence/AX-PUB-CI-004_REPRODUCIBLE_DEVELOPER_EXPERIENCE_VALIDATION.md'
      - 'evidence/AX-PUB-CI-005_SDK_CANDIDATE_VALIDATION.md'
      - 'evidence/AX-PUB-CI-006_SUPPLY_CHAIN_RELEASE_CANDIDATE_VALIDATION.md'
      - 'evidence/AX-PUB-CI-007_EXTERNAL_EVALUATION_READINESS_VALIDATION.md'
      - 'evidence/AX-PUB-CI-013_SDK_SUPPORT_SECURITY_CONTRACT_VALIDATION.md'
      - 'evidence/AX-PUB-CI-014_INSTALLABLE_EXTERNAL_EVALUATOR_HANDOFF_VALIDATION.md'
      - 'evidence/AX-PUB-CI-015_EVALUATOR_HANDOFF_PROMOTED_MATERIALIZATION.md'
      - 'release-candidate/**'
      - 'sdk-candidate/**'
      - 'snapshots/**'
      - 'specifications/**'
      - 'schemas/**'
      - 'reference-implementations/**'
      - '.github/ISSUE_TEMPLATE/external-evaluation.yml'
      - 'tools/check_artifact_manifest.py'
      - 'tools/check_manifest_productization_extensions.py'
      - 'tools/check_manifest_evaluator_handoff_extension.py'
      - 'tools/check_developer_contract_baseline.py'
      - 'tools/check_developer_experience_state.py'
      - 'tools/check_sdk_candidate_boundary.py'
      - 'tools/check_sdk_candidate_state.py'
      - 'tools/check_supply_chain_release_candidate.py'
      - 'tools/check_external_evaluation_readiness.py'
      - 'tools/check_external_evaluation_report.py'
      - 'tools/run_external_evaluation.py'
      - 'tools/check_public_conformance_boundary.py'
      - '.github/workflows/validate-external-evaluation-readiness.yml'
      - '.github/workflows/validate-public-artifact-manifest.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'artifacts/**'
      - 'conformance/**'
      - 'docs/**'
      - 'evidence/AX-PUB-CI-004_REPRODUCIBLE_DEVELOPER_EXPERIENCE_VALIDATION.md'
      - 'evidence/AX-PUB-CI-005_SDK_CANDIDATE_VALIDATION.md'
      - 'evidence/AX-PUB-CI-006_SUPPLY_CHAIN_RELEASE_CANDIDATE_VALIDATION.md'
      - 'evidence/AX-PUB-CI-007_EXTERNAL_EVALUATION_READINESS_VALIDATION.md'
      - 'evidence/AX-PUB-CI-013_SDK_SUPPORT_SECURITY_CONTRACT_VALIDATION.md'
      - 'evidence/AX-PUB-CI-014_INSTALLABLE_EXTERNAL_EVALUATOR_HANDOFF_VALIDATION.md'
      - 'evidence/AX-PUB-CI-015_EVALUATOR_HANDOFF_PROMOTED_MATERIALIZATION.md'
      - 'release-candidate/**'
      - 'sdk-candidate/**'
      - 'snapshots/**'
      - 'specifications/**'
      - 'schemas/**'
      - 'reference-implementations/**'
      - '.github/ISSUE_TEMPLATE/external-evaluation.yml'
      - 'tools/check_artifact_manifest.py'
      - 'tools/check_manifest_productization_extensions.py'
      - 'tools/check_manifest_evaluator_handoff_extension.py'
      - 'tools/check_developer_contract_baseline.py'
      - 'tools/check_developer_experience_state.py'
      - 'tools/check_sdk_candidate_boundary.py'
      - 'tools/check_sdk_candidate_state.py'
      - 'tools/check_supply_chain_release_candidate.py'
      - 'tools/check_external_evaluation_readiness.py'
      - 'tools/check_external_evaluation_report.py'
      - 'tools/run_external_evaluation.py'
      - 'tools/check_public_conformance_boundary.py'
      - '.github/workflows/validate-external-evaluation-readiness.yml'
      - '.github/workflows/validate-public-artifact-manifest.yml'

permissions:
  contents: read

jobs:
  validate-public-artifact-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Parse public machine-readable artifacts
        run: |
          python3 -m json.tool artifacts/AX-PUB-MANIFEST-001.json > /dev/null
          python3 -m json.tool artifacts/AX-PUB-DEV-002.json > /dev/null
          python3 -m json.tool artifacts/AX-PUB-DEV-003.json > /dev/null
          python3 -m json.tool artifacts/AX-PUB-DEV-004.json > /dev/null
          python3 -m json.tool artifacts/AX-PUB-DEV-005.json > /dev/null
          python3 -m json.tool artifacts/AX-PUB-DEV-006.json > /dev/null
          python3 -m json.tool artifacts/AX-PUB-API-001.json > /dev/null
          python3 -m json.tool artifacts/AX-PUB-SUP-001.json > /dev/null
          python3 -m json.tool artifacts/AX-PUB-SEC-001.json > /dev/null
          python3 -m json.tool artifacts/AX-PUB-EVAL-PACK-001.json > /dev/null
          python3 -m json.tool release-candidate/AX-PUB-RC-001.json > /dev/null

      - name: Compile public integrity checkers
        run: |
          python3 -m py_compile tools/check_artifact_manifest.py
          python3 -m py_compile tools/check_manifest_productization_extensions.py
          python3 -m py_compile tools/check_manifest_evaluator_handoff_extension.py
          python3 -m py_compile tools/check_developer_contract_baseline.py
          python3 -m py_compile tools/check_developer_experience_state.py
          python3 -m py_compile tools/check_sdk_candidate_boundary.py
          python3 -m py_compile tools/check_sdk_candidate_state.py
          python3 -m py_compile tools/check_supply_chain_release_candidate.py
          python3 -m py_compile tools/check_external_evaluation_readiness.py
          python3 -m py_compile tools/check_external_evaluation_report.py
          python3 -m py_compile tools/run_external_evaluation.py
          python3 -m py_compile tools/check_public_conformance_boundary.py

      - name: Validate artifact paths versions and compatibility
        run: python3 tools/check_artifact_manifest.py

      - name: Validate Gate-05C productization manifest extensions
        run: python3 tools/check_manifest_productization_extensions.py

      - name: Validate evaluator-handoff manifest extension
        run: python3 tools/check_manifest_evaluator_handoff_extension.py

      - name: Validate developer contract baseline
        run: python3 tools/check_developer_contract_baseline.py

      - name: Validate closed Gate-01 governance state
        run: python3 tools/check_developer_experience_state.py

      - name: Validate closed DEV-GATE-02 governance state
        run: python3 tools/check_sdk_candidate_state.py

      - name: Validate DEV-GATE-03 governance state
        run: python3 tools/check_supply_chain_release_candidate.py

      - name: Validate DEV-GATE-04 governance state
        run: python3 tools/check_external_evaluation_readiness.py

      - name: Validate SDK candidate public boundary
        run: python3 tools/check_sdk_candidate_boundary.py

      - name: Validate public-only conformance boundary
        run: python3 tools/check_public_conformance_boundary.py

  temporary-materialize-v126-on-pr-head:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'governance/release-readiness-manifest-v1.26' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: governance/release-readiness-manifest-v1.26
          fetch-depth: 1

      - name: Detect whether v1.26 materialization is still required
        id: state
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('artifacts/AX-PUB-MANIFEST-001.json'))['manifest_version'])")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = '1.25' ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          elif [ "$VERSION" = '1.26' ]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected manifest version: $VERSION" >&2
            exit 1
          fi

      - name: Apply one-shot v1.26 migration
        if: steps.state.outputs.needed == 'true'
        run: |
          python3 tools/promote_manifest_release_readiness_v126.py
          python3 -m json.tool artifacts/AX-PUB-MANIFEST-001.json >/dev/null

      - name: Verify fail-closed promoted state
        if: steps.state.outputs.needed == 'true'
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open('artifacts/AX-PUB-MANIFEST-001.json'))
          assert m['manifest_version'] == '1.26'
          assert m['current_developer_program']['active_phase'] == 'DEV-GATE-05C — Distribution & External Validation'
          r = m['current_sdk_release_readiness_aggregation']
          assert r['validation_evidence'] == 'AX-PUB-CI-016'
          assert (r['required_dimension_count'], r['established_dimension_count'], r['blocked_dimension_count']) == (13, 4, 9)
          assert r['ready_for_dev_gate_05d_authority_review'] is False
          assert r['dev_gate_05d_authorized'] is False
          assert r['supported_sdk_established'] is False
          assert r['sdk_publication_disposition'] == 'SDK PUBLICATION NOT AUTHORIZED'
          print('AX_TEMP_V126_BOUNDARY_PASS')
          PY

      - name: Commit generated manifest to exact PR branch
        if: steps.state.outputs.needed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/AX-PUB-MANIFEST-001.json
          git diff --cached --quiet && { echo 'Expected generated manifest diff is missing.' >&2; exit 1; }
          git commit -m 'governance: materialize manifest v1.26 release-readiness state'
          git push origin HEAD:governance/release-readiness-manifest-v1.26
