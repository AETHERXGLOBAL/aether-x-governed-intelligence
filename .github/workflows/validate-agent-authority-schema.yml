name: Validate Agent Tool-Use Authority Contract

on:
  push:
    branches: [main]
    paths:
      - 'schemas/AX-PUB-SCHEMA-003_AGENT_TOOL_USE_AUTHORITY_ENVELOPE.schema.json'
      - 'reference-implementations/agent-tool-authority-validator/examples/**'
      - 'tools/check_agent_authority_schema_alignment.py'
      - '.github/workflows/validate-agent-authority-schema.yml'
  pull_request:
    paths:
      - 'schemas/AX-PUB-SCHEMA-003_AGENT_TOOL_USE_AUTHORITY_ENVELOPE.schema.json'
      - 'reference-implementations/agent-tool-authority-validator/examples/**'
      - 'tools/check_agent_authority_schema_alignment.py'
      - '.github/workflows/validate-agent-authority-schema.yml'

permissions:
  contents: read

jobs:
  validate-agent-authority-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public repository only
        uses: actions/checkout@v4
      - name: Parse machine-readable authority contract
        run: python3 -m json.tool schemas/AX-PUB-SCHEMA-003_AGENT_TOOL_USE_AUTHORITY_ENVELOPE.schema.json > /dev/null
      - name: Parse public reference examples
        run: |
          python3 -m json.tool reference-implementations/agent-tool-authority-validator/examples/valid_envelope.json > /dev/null
          python3 -m json.tool reference-implementations/agent-tool-authority-validator/examples/invalid_envelope.json > /dev/null
      - name: Check schema and reference alignment
        run: python3 tools/check_agent_authority_schema_alignment.py
