name: ReproCert CI

on:
  pull_request:
    paths:
      - 'tools/reprocert/**'
      - '.github/workflows/reprocert-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/reprocert/**'
      - '.github/workflows/reprocert-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e "tools/reprocert[dev]"
      - name: Unit and adversarial tests
        run: pytest tools/reprocert/tests
      - name: Basic claim round-trip
        working-directory: tools/reprocert/examples/basic
        shell: bash
        run: |
          reprocert run claim.yml --output certificate.json
          reprocert verify certificate.json --claim claim.yml --evidence-root .
          reprocert inspect certificate.json

  action-smoke:
    name: Composite action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Execute ReproCert composite action
        id: reprocert
        uses: ./tools/reprocert
        with:
          claim: tools/reprocert/examples/basic/claim.yml
          certificate: reprocert-action-certificate.json
      - name: Assert exported verdict
        shell: bash
        run: test "${{ steps.reprocert.outputs.verdict }}" = "PASS"

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build isolated package
        working-directory: tools/reprocert
        run: |
          python -m pip install build
          python -m build
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: reprocert-dist
          path: tools/reprocert/dist/*
          if-no-files-found: error
