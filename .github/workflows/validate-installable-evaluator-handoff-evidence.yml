name: Validate Installable Evaluator Handoff Evidence

on:
  pull_request:
    paths:
      - 'evidence/AX-PUB-CI-014_INSTALLABLE_EXTERNAL_EVALUATOR_HANDOFF_VALIDATION.md'
      - 'tools/check_installable_evaluator_handoff_evidence.py'
      - '.github/workflows/validate-installable-evaluator-handoff-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: AX-PUB-CI-014 evidence integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up CPython 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Compile evidence checker
        run: python -m py_compile tools/check_installable_evaluator_handoff_evidence.py

      - name: Validate AX-PUB-CI-014
        run: python tools/check_installable_evaluator_handoff_evidence.py

      - name: Explicit claim boundary
        run: |
          echo 'AX-PUB-CI-014: HANDOFF VALIDATION EVIDENCE ONLY'
          echo 'HUMAN EXTERNAL EVALUATION: NOT ESTABLISHED'
          echo 'EXTERNAL REGISTRY VALIDATION: NOT ESTABLISHED'
          echo 'SDK PUBLICATION: NOT AUTHORIZED'
