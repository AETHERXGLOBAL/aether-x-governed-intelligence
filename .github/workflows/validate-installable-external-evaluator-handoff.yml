name: Validate Installable External Evaluator Handoff

on:
  pull_request:
    paths:
      - 'artifacts/AX-PUB-EVAL-PACK-001.json'
      - 'docs/INSTALLABLE_EXTERNAL_EVALUATOR_GUIDE.md'
      - 'examples/external-evaluation/AX-PUB-EVAL-REPORT-002.template.json'
      - 'tools/build_installable_evaluator_handoff.py'
      - 'tools/check_installable_evaluator_handoff.py'
      - 'tools/check_installable_external_evaluation_report.py'
      - 'tools/run_installable_evaluator_handoff_ci.py'
      - 'artifacts/AX-PUB-API-001.json'
      - 'artifacts/AX-PUB-SUP-001.json'
      - 'artifacts/AX-PUB-SEC-001.json'
      - 'artifacts/AX-PUB-DEV-009.json'
      - 'docs/LIMITATIONS_AND_UNSUPPORTED_USES.md'
      - 'sdk-release-candidate/python/**'
      - '.github/workflows/validate-installable-external-evaluator-handoff.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/AX-PUB-EVAL-PACK-001.json'
      - 'docs/INSTALLABLE_EXTERNAL_EVALUATOR_GUIDE.md'
      - 'examples/external-evaluation/AX-PUB-EVAL-REPORT-002.template.json'
      - 'tools/build_installable_evaluator_handoff.py'
      - 'tools/check_installable_evaluator_handoff.py'
      - 'tools/check_installable_external_evaluation_report.py'
      - 'tools/run_installable_evaluator_handoff_ci.py'
      - 'artifacts/AX-PUB-API-001.json'
      - 'artifacts/AX-PUB-SUP-001.json'
      - 'artifacts/AX-PUB-SEC-001.json'
      - 'artifacts/AX-PUB-DEV-009.json'
      - 'docs/LIMITATIONS_AND_UNSUPPORTED_USES.md'
      - 'sdk-release-candidate/python/**'
      - '.github/workflows/validate-installable-external-evaluator-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluator-handoff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-handoff:
    name: Deterministic evaluator handoff / CPython 3.11-3.14 rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up CPython 3.11
        id: py311
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Set up CPython 3.12
        id: py312
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up CPython 3.13
        id: py313
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Set up CPython 3.14
        id: py314
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'

      - name: Run bounded evaluator-handoff validation
        run: |
          '${{ steps.py314.outputs.python-path }}' tools/run_installable_evaluator_handoff_ci.py \
            --py311 '${{ steps.py311.outputs.python-path }}' \
            --py312 '${{ steps.py312.outputs.python-path }}' \
            --py313 '${{ steps.py313.outputs.python-path }}' \
            --py314 '${{ steps.py314.outputs.python-path }}'

      - name: Preserve deterministic handoff as short-lived CI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ax-pub-eval-pack-001-${{ github.sha }}
          path: dist-evaluator-handoff-ci/publish/
          if-no-files-found: error
          retention-days: 7

      - name: Explicit authority boundary
        run: |
          echo 'EVALUATOR HANDOFF PACK: CI VALIDATION ONLY'
          echo 'LOCAL REHEARSAL: NOT FINAL HUMAN EXTERNAL EVALUATION'
          echo 'FINAL REPORT REQUIRES AUTHORIZED EXTERNAL INDEX'
          echo 'TESTPYPI UPLOAD NOT AUTHORIZED'
          echo 'PYPI UPLOAD NOT AUTHORIZED'
          echo 'HUMAN EXTERNAL EVALUATION NOT ESTABLISHED BY CI'
          echo 'SDK PUBLICATION NOT AUTHORIZED'
