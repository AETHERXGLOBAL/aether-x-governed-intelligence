name: ReproCert bug report
description: Report a reproducible defect in the public AETHER X ReproCert developer tool.
title: "[ReproCert Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a ReproCert issue. Do not include credentials, customer data, private source code or sensitive vulnerability details here.
  - type: input
    id: version
    attributes:
      label: ReproCert version or commit
      description: Example: 0.1.0a1 or a Git commit SHA.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI
        - GitHub Action
        - Claim schema
        - Certificate verification
        - Evidence collection
        - Packaging / installation
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest non-sensitive claim/config and commands needed to reproduce the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and Python version
      placeholder: Ubuntu 24.04 / Python 3.13
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public issue safety
      options:
        - label: I confirm this issue contains no credentials, confidential customer data, private source code or sensitive exploit details.
          required: true
